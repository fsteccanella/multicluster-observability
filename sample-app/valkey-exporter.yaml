apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-exporter
  labels:
    app.kubernetes.io/name: valkey-exporter
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-exporter
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.89.0
          env:
            - name: REDIS_ADDR
              value: redis://valkey-cart:6379
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-exporter
  labels:
    app.kubernetes.io/name: valkey-exporter
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  selector:
    app.kubernetes.io/name: valkey-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: valkey-exporter
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
    monitoring: datastore
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 8s
