apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hub-tempo
  namespace: observability
  labels:
    kubernetes.io/service-name: hub-tempo
addressType: IPv4
ports:
  - {name: http, protocol: TCP, port: 30200}
  - {name: otlp-grpc, protocol: TCP, port: 30417}
endpoints:
  - addresses: ["HUB_NODE_IP"]
