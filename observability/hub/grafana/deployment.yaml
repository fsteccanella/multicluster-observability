apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            # Grafana's UI recognizes the literal default "admin" credential and
            # presents a change-password screen. Use a fixed non-default demo value.
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - {containerPort: 3000, name: http}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
